name: Update Yir Workbench Data

on:
  workflow_dispatch:
  schedule:
    # Weekdays after A-share close, plus news refresh. Times are UTC.
    - cron: "15 8 * * 1-5"
    - cron: "30 23 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate same-origin data
        run: node scripts/update-data.mjs

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/market.json
          git diff --cached --quiet || git commit -m "Update workbench data"
          git push
