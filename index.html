var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };

function waitMs(ms){return new Promise(function(resolve){setTimeout(resolve,ms||0);});}
function withFreshTs(url){return url+(url.indexOf('?')>=0?'&':'?')+'_ts='+(Date.now())+'-'+Math.random().toString(16).slice(2,8);}
async function fetchJSONFresh(url,ms,retries){
  var lastErr;
  for(var i=0;i<(retries||1);i++){
    try{return JSON.parse(await fetchWithTimeout(withFreshTs(url),ms||12000));}
    catch(err){lastErr=err;if(i+1<(retries||1))await waitMs(250*(i+1));}
  }
  throw lastErr||new Error('请求失败');
}

async function refreshNews(){

  try{
    var livePayload=await loadLiveNewsPayload();
    var liveKey=applyNewsPayload(livePayload);
    if(state)state.textContent=(livePayload.stale?'新闻源非今日':'已从源更新')+' · '+formatCNDate(livePayload.dataDate||liveKey);
    renderCachedNews(liveKey);
    return;
  }catch(liveErr){
    try{
      var fallbackPayload=await loadFallbackNewsPayload();
      var fallbackKey=applyNewsPayload(fallbackPayload);
      if(!App.db.newsMeta)App.db.newsMeta={};
      App.db.newsMeta[fallbackKey].message='实时新闻获取失败：'+liveErr.message+'。已回退站内备份。'+(App.db.newsMeta[fallbackKey].message||'');

      if(state)state.textContent='新闻源不可用';
      if(!App.db.newsMeta)App.db.newsMeta={};
      App.db.newsMeta[App.today()]={date:App.today(),dataDate:App.today(),generatedAt:new Date().toISOString(),source:'新闻源',stale:true,message:'实时新闻读取失败：'+liveErr.message+'；本地备份读取失败：'+fallbackErr.message+'。'};

  }
}

async function fetchMarketBreadthLive(){
  var marketFs='m:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23,m:0+t:81+s:2048';
  var pageSize=100;
  var base='https://push2delay.eastmoney.com/api/qt/clist/get?po=1&ut=bd1d9ddb04089700cf9c27f6f7426281&fltt=2&invt=2&fid=f3&fs='+encodeURIComponent(marketFs)+'&fields=f2,f3,f12,f14,f100&np=1&pn=';
  var first=await fetchJSONFresh(base+'1&pz='+pageSize,12000,3);
  var total=Number(first.data&&first.data.total||0);
  var pages=Math.max(1,Math.ceil(total/pageSize));
  var up=0,down=0,flat=0,unpriced=0,counted=0,approxLimitUp=0,errors=[];
  function consume(pageJson){
    normalizeDiffItems(pageJson.data&&pageJson.data.diff).forEach(function(x){
      var p=Number(x.f3);
      counted+=1;
      if(!Number.isFinite(p)){unpriced+=1;return;}
      if(p>0)up+=1;else if(p<0)down+=1;else flat+=1;
      if(p>=9.8)approxLimitUp+=1;
    });
  }
  consume(first);
  var queue=[];
  for(var page=2;page<=pages;page++)queue.push(page);
  var cursor=0;
  async function worker(){
    while(cursor<queue.length){
      var current=queue[cursor++];
      try{consume(await fetchJSONFresh(base+current+'&pz='+pageSize,12000,3));}
      catch(err){errors.push('第'+current+'页：'+err.message);}
    }
  }
  var workers=[];
  for(var i=0;i<Math.min(6,queue.length);i++)workers.push(worker());
  await Promise.all(workers);
  return {total:total,up:up,down:down,flat:flat,unpriced:unpriced,counted:counted,approxLimitUp:approxLimitUp,scope:'沪深京A股',provider:'东方财富延迟行情',complete:!errors.length&&counted===total,error:errors[0]||''};
}

async function loadLiveMarketPayload(targetDate){
  var results=await Promise.allSettled([fetchIndicesLive(),fetchLimitUpPoolLive(targetDate),fetchMarketBreadthLive()]);
  if(results.every(function(r){return r.status!=='fulfilled';}))throw new Error(results.map(function(r){return r.reason&&r.reason.message||'';}).filter(Boolean).join('；')||'实时看盘接口全部失败');
  var limit=results[1].status==='fulfilled'?results[1].value:{qdate:targetDate||App.today(),total:0,sectorLimitUps:[],consecutiveLimitUps:[]};
  var breadth=results[2].status==='fulfilled'?results[2].value:{total:0,up:0,down:0,flat:0,unpriced:0,counted:0,approxLimitUp:0,scope:'沪深京A股',provider:'东方财富延迟行情',complete:false,error:''};
  var top=limit.sectorLimitUps&&limit.sectorLimitUps.length?limit.sectorLimitUps[0]:{sector:'待补充',count:0};
  return {date:App.today(),tradingDate:limit.qdate||targetDate||App.today(),generatedAt:new Date().toISOString(),source:'东方财富实时接口 · 点击直连',dataDate:limit.qdate||targetDate||App.today(),dataScope:breadth.scope||'沪深京A股',breadthProvider:breadth.provider||'东方财富延迟行情',breadthComplete:breadth.complete===true,breadthCounted:breadth.counted||0,unpriced:breadth.unpriced||0,indices:results[0].status==='fulfilled'?results[0].value:[],total:breadth.total||0,up:breadth.up||0,down:breadth.down||0,flat:breadth.flat||0,limitUpCount:limit.total||breadth.approxLimitUp||0,downLimitCount:0,topSector:top.sector,topSectorCount:top.count,sectorLimitUps:limit.sectorLimitUps||[],consecutiveLimitUps:limit.consecutiveLimitUps||[],errors:[results[0].status==='rejected'?'指数：'+results[0].reason.message:'',results[1].status==='rejected'?'涨停池：'+results[1].reason.message:'',results[2].status==='rejected'?'涨跌家数：'+results[2].reason.message:'',results[2].status==='fulfilled'&&breadth.error?'涨跌家数：'+breadth.error:''].filter(Boolean)};
}
async function loadFallbackMarketPayload(){
  var payload=await fetchJSONFresh('./data/market.json',10000,1);
  if(!payload||typeof payload!=='object'||(!('up'in payload)&&!Array.isArray(payload.indices)))throw new Error('data/market.json 内容不是看盘数据');
  return payload;
}
async function fetchStockBoard(){
  var targetDate=$('#sd-date')?$('#sd-date').value:App.today();
  toast('正在联网获取最新看盘数据');
  try{
    var liveData=normalizeBoardData(await loadLiveMarketPayload(targetDate));
    saveStockBoardData(liveData);
    toast(liveData.errors&&liveData.errors.length?'智能看盘已更新（部分字段已重试/补全）':'智能看盘已更新');
  }catch(liveErr){
    try{
      var fallbackData=normalizeBoardData(await loadFallbackMarketPayload());
      fallbackData.source=(fallbackData.source||'同源看盘库')+' · 站内备份';
      fallbackData.errors=(fallbackData.errors||[]).concat(['实时看盘获取失败：'+liveErr.message]);
      saveStockBoardData(fallbackData);
      toast('实时看盘失败，已回退站内备份');
    }catch(fallbackErr){
      toast('看盘数据获取失败：'+liveErr.message+'；本地备份也不可用');
      renderStockData();
    }
  }
}
function renderStockData(){
  var d=$('#sd-display');if(!d)return;var date=$('#sd-date')?$('#sd-date').value:App.today();var data=App.db.stockData.find(function(x){return x.date===date;})||App.db.stockData.slice(-1)[0];
  if(data){
    var idx=(data.indices||[]).map(function(x){return '<div class="stat-box"><div class="stat-num" style="font-size:18px;color:var(--c1)">'+htmlSafe(x.name||x.f14||'指数')+'</div><div class="stat-label">'+htmlSafe(x.price||x.f2||'')+' · '+htmlSafe((x.changePct!=null?x.changePct:x.f3)||'')+'%</div></div>';}).join('');
    var meta='<div class="soft-note stock-meta">交易数据日期：'+formatCNDate(data.dataDate||data.date)+' · 获取时间：'+formatCNDateTime(data.generatedAt)+' · 口径：'+htmlSafe(data.dataScope||'沪深京A股')+' · '+htmlSafe(data.breadthProvider||'东方财富延迟行情')+(data.unpriced?(' · 未定价/停牌 '+data.unpriced+' 家'):'')+(data.breadthComplete===false?' · 涨跌家数抓取不完整':'')+'</div>';
    var err=(data.errors&&data.errors.length)?'<div class="soft-note" style="margin-top:8px;color:var(--c4)">提示：'+htmlSafe(data.errors.join('；'))+'</div>':'';
    d.innerHTML=meta+'<div class="grid-2"><div class="stat-box"><div class="stat-num" style="color:var(--c2)">'+(data.up||0)+'</div><div class="stat-label">交易日上涨家数</div></div><div class="stat-box"><div class="stat-num" style="color:var(--c4)">'+(data.down||0)+'</div><div class="stat-label">交易日下跌家数</div></div><div class="stat-box"><div class="stat-num" style="color:var(--c3)">'+(data.topSectorCount||data.upLimit||0)+'</div><div class="stat-label">涨停最多板块个股数</div></div><div class="stat-box"><div class="stat-num" style="color:var(--c1);font-size:18px">'+htmlSafe(data.topSector||'待补充')+'</div><div class="stat-label">涨停最多板块</div></div>'+idx+'</div>'+(data.hotStocks?'<div style="margin-top:10px;font-size:var(--fs-aux);color:var(--text-sub)">连续涨停个股：'+htmlSafe(data.hotStocks)+'</div>':'')+(data.source?'<div class="news-source">来源：'+htmlSafe(data.source)+'</div>':'')+err;
  }else d.innerHTML='<div class="empty-hint">暂无看盘数据。部署 GitHub Actions 后会自动生成，也可手动/AI录入。</div>';
  drawSectorChart();
}
function drawSectorChart(){
  var ctx=$('#sector-chart');if(!ctx)return;
  var date=$('#sd-date')?$('#sd-date').value:App.today();
  var current=App.db.stockData.find(function(x){return x.date===date;})||App.db.stockData.slice(-1)[0];
  var selectedDate=current&&current.date?current.date:date;
  var start=new Date(selectedDate);start.setDate(start.getDate()-6);
  var sectors={};
  function addSector(name,count){
    name=String(name||'其他').trim();count=Number(count||0);
    if(!name||!Number.isFinite(count)||count<=0)return;
    sectors[name]=(sectors[name]||0)+count;
  }
  App.db.stockData.forEach(function(day){
    var dayDate=new Date(day.date||selectedDate);
    if(dayDate<start||dayDate>new Date(selectedDate))return;
    if(Array.isArray(day.sectorLimitUps)&&day.sectorLimitUps.length){
      day.sectorLimitUps.forEach(function(x){addSector(x.sector||x.name,x.count||x.num||x.value);});
    }else if(day.topSector){
      addSector(day.topSector,day.topSectorCount||day.upLimit||1);
    }else if(day.sectors){
      day.sectors.split(/[,，]/).forEach(function(s){addSector(s,1);});
    }
  });
  if(!Object.keys(sectors).length&&current&&Array.isArray(current.sectorLimitUps)){
    current.sectorLimitUps.forEach(function(x){addSector(x.sector||x.name,x.count||x.num||x.value);});
  }
  var rows=Object.keys(sectors).map(function(k){return{label:k,value:sectors[k]};}).sort(function(a,b){return b.value-a.value;});
  if(rows.length>12){var other=rows.slice(12).reduce(function(s,x){return s+x.value;},0);rows=rows.slice(0,12);if(other>0)rows.push({label:'其他',value:other});}
  var labels=rows.map(function(x){return x.label;}),vals=rows.map(function(x){return x.value;});
  var total=vals.reduce(function(s,v){return s+v;},0);
  var colors=['#ff9eb5','#5ac8fa','#af52de','#ffcc99','#34c759','#ffd3b6','#c7ceea','#ffaaa5','#0071e3','#ff9500','#5856d6','#a8e6cf','#ffe4e1'];
  var legend=$('#sector-legend');
  if(legend){
    legend.innerHTML=rows.length?rows.map(function(x,i){var p=total?Math.round(x.value/total*1000)/10:0;return '<div class="sector-legend-item"><span class="sector-legend-swatch" style="background:'+colors[i%colors.length]+'"></span><span class="sector-legend-label">'+htmlSafe(x.label)+'</span><span class="sector-legend-value">'+x.value+' · '+p+'%</span></div>';}).join(''):'<div class="empty-hint">暂无行业分布</div>';
  }
  var mobile=window.matchMedia&&window.matchMedia('(max-width: 767px)').matches;
  if(App.charts.sector)App.charts.sector.destroy();
  App.charts.sector=new Chart(ctx,{type:mobile?'doughnut':'pie',data:{labels:labels.length?labels:['暂无数据'],datasets:[{data:vals.length?vals:[1],backgroundColor:colors,borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:mobile?'52%':'0%',layout:{padding:mobile?2:8},plugins:{legend:{display:false},tooltip:{callbacks:{label:function(item){var v=item.parsed||0,p=total?Math.round(v/total*1000)/10:0;return item.label+'：'+v+'只，占比'+p+'%';}}}}}});
}

</script>
